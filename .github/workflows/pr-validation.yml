name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Stable required check/job name: PR validation (job id: pr-validation).
# Keep this workflow path-unfiltered so shared-package changes run every consumer check.
# The root test command discovers the complete game/API/shared suite.
# The whitespace check uses the merge-base-to-head three-dot range to exclude base-only changes.
# The dry-run below verifies non-zero command propagation without failing this validation job.
# Runtime evidence still requires external PR activity for superseded-run cancellation and a
# shared-package-only change; reproduce those cases by pushing a second head during an active
# run, or by opening a temporary PR whose only diff is under packages/shared, respectively.

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Report validated commit
        run: |
          echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Checked-out SHA: $(git rev-parse HEAD)"

      - name: Validate whitespace and static diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Verify command failure propagation (safe dry-run)
        shell: bash
        run: |
          set -Eeuo pipefail
          if bash -e -c 'false; echo "unreachable"'; then
            echo "Failure probe unexpectedly succeeded." >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -ne 0
          echo "Safe failure probe propagated non-zero status: $status"

      - name: Verify workspace coverage contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_file=".github/workflows/pr-validation.yml"
          if grep -Eq '^[[:space:]]+paths(-ignore)?:' "$workflow_file"; then
            echo "Path filters would allow shared-package changes to bypass validation." >&2
            exit 1
          fi
          grep -Fq 'run: bun run typecheck' "$workflow_file"
          grep -Fq 'run: bun test' "$workflow_file"
          grep -Fq 'run: bun run build' "$workflow_file"
          test -d apps/game
          test -d apps/api
          test -d packages/shared
          echo "Unfiltered root validation covers game, API, and shared workspace paths."

      - name: Typecheck complete workspace
        run: bun run typecheck

      - name: Test complete workspace
        run: bun test

      - name: Build application packages
        run: bun run build
