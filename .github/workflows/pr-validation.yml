name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Stable required check/job name: PR validation (job id: pr-validation).
# Keep this workflow path-unfiltered so shared-package changes run every consumer check.
# The root test command discovers the complete game/shared suite and any future API tests.
# The API package currently has no test files; workspace typecheck and build cover its paths.
# The whitespace check uses the merge-base-to-head three-dot range to exclude base-only changes.

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Report validated commit
        run: |
          echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Checked-out SHA: $(git rev-parse HEAD)"

      - name: Validate whitespace and static diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Typecheck complete workspace
        run: bun run typecheck

      - name: Test complete workspace
        run: bun test

      - name: Build application packages
        run: bun run build
