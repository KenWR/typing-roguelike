name: Format actor effect HUD

on:
  push:
    branches:
      - feat/344-actor-effect-hud

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(combat): apply biome formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/344-actor-effect-hud
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Format effect HUD changes
        run: |
          bunx biome format --write \
            apps/game/src/game/assets/effect-visual-assets.ts \
            apps/game/src/game/combat/player-combat-runtime.ts \
            apps/game/src/game/combat/skill-impact-resolver.ts \
            apps/game/src/game/hud/actor-effect-hud.ts \
            apps/game/src/game/hud/command-hud.ts \
            apps/game/src/game/hud/effect-presentation.ts \
            apps/game/src/game/scenes/CombatFoundationScene.ts \
            apps/game/tests/actor-effect-presentation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/game/assets/effect-visual-assets.ts \
            apps/game/src/game/combat/player-combat-runtime.ts \
            apps/game/src/game/combat/skill-impact-resolver.ts \
            apps/game/src/game/hud/actor-effect-hud.ts \
            apps/game/src/game/hud/command-hud.ts \
            apps/game/src/game/hud/effect-presentation.ts \
            apps/game/src/game/scenes/CombatFoundationScene.ts \
            apps/game/tests/actor-effect-presentation.test.ts
          git commit -m 'style(combat): apply biome formatting'
          git push origin HEAD:feat/344-actor-effect-hud
